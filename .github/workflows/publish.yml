name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Build
        run: uv build
      - name: Audit sdist for secrets
        run: |
          set -euo pipefail
          SDIST=$(ls dist/*.tar.gz)
          echo "Auditing $SDIST"
          BAD_FILES=$(tar tzf "$SDIST" | grep -iE '\.env($|\.)|mcpregistry|_token$|_secret$|\.pem$|id_rsa' || true)
          if [ -n "$BAD_FILES" ]; then
            echo "::error::Dangerous files found in sdist:"
            echo "$BAD_FILES"
            exit 1
          fi
          TEMP_DIR=$(mktemp -d)
          tar xzf "$SDIST" -C "$TEMP_DIR"
          LEAKED=$(grep -rE 'ghu_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|pypi-[A-Za-z0-9]{20,}|github_pat_' "$TEMP_DIR" || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Token patterns found in sdist content:"
            echo "$LEAKED" | sed "s|$TEMP_DIR/||"
            exit 1
          fi
          echo "sdist audit passed"
          rm -rf "$TEMP_DIR"
      - name: Publish to PyPI
        # Docker-based action: must be pinned by tag, not SHA — SHA pinning
        # breaks its docker manifest resolution (upstream-documented caveat)
        uses: pypa/gh-action-pypi-publish@v1.14.2
